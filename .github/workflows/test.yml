name: "Tests"

on:
  push:
    tags:
      - v**
    branches-ignore:
      - "dependabot/**"
      - "sourcery/**"
      - "pre-commit-ci-update-config"
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install just
        run: |
          uv tool install rust-just
      - name: Install dependencies
        run: |
          uv sync --group docs --locked
      - name: Show installed dependencies
        run: |
          uv tree
      - name: Build docs
        run: just docs/html

  docs-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install just
        run: |
          uv tool install rust-just
      - name: Install dependencies
        run: |
          uv sync --group docs --locked
      - name: Show installed dependencies
        continue-on-error: true
        run: |
          uv tree
      - name: Build docs
        run: just docs/linkcheck

  test:
    runs-on: ${{ matrix.os }}
    needs: [pre-commit, docs]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ["3.14"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2
        with:
          # Skip to run brew update command on macOS, duo to
          # https://github.com/ts-graphviz/setup-graphviz/issues/457
          macos-skip-brew-update: "true"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin" # See 'Supported distributions' for available options
          java-version: "17"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv sync --group test --locked
      - name: Run tests
        run: |
          uv run pytest --cov=./ --cov-report term --cov-report xml --cov-config .coveragerc tests
      - name: Codecov Upload
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          name: ${{ matrix.os }}-py${{ matrix.python-version }}

  test-docker:
    runs-on: ubuntu-latest
    needs: [pre-commit, docs]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: "openapi-diagram"
          tags: test
          registry: ghcr.io
          pushImage: false
      - name: Start container
        run: docker run -d --rm --name test-container -p 9001:9001 ghcr.io/${{ github.repository_owner }}/openapi-diagram:test
      - name: Check that container is healthy
        uses: stringbean/docker-healthcheck-action@v3
        with:
          container: test-container
          wait-time: 50
          require-status: running
          require-healthy: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install openapi-diagram
        run: |
          uv sync --locked --no-dev
      - name: Fetch files
        run: |
          uv run openapi-diagram fetch -s tests/data/petstore-3-0.json -o diagrams.svg -m single -d svg -u http://localhost:9001

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [test, test-docker]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build dist
        run: uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          print-hash: true
          attestations: true
